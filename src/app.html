<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Arbitrage volley</title>
		<script>
			// Préférences d'affichage appliquées avant le premier affichage (même logique que appliquerAffichage).
			try {
				var p = JSON.parse(localStorage.getItem('preferences') || '{}'), d = document.documentElement.dataset;
				if (p.theme && p.theme !== 'auto') d.theme = p.theme;
				if (p.taille && p.taille !== 'normale') d.taille = p.taille;
				if (p.animations === 'reduites') d.animations = 'reduites';
				if (p.contraste === 'eleve') d.contraste = 'eleve';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
