# Supabase (offre gratuite) met en pause un projet après 7 jours sans activité.
# Tous les 3 jours, une lecture légère sur l'API de production le garde éveillé.
# Secrets du dépôt : SUPABASE_PROD_URL et SUPABASE_PROD_ANON_KEY (clé publique, jamais la clé service_role).
name: Réveil Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture légère sur la base de production
        env:
          URL: ${{ secrets.SUPABASE_PROD_URL }}
          CLE: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/regles?select=id&limit=1" \
            -H "apikey: $CLE" -H "Authorization: Bearer $CLE")
          echo "Réponse : HTTP $code"
          test "$code" = 200
